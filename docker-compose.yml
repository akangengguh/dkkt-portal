services:
  postgres:
    image: postgres:16-alpine
    container_name: dkkt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dkkt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Docker Compose}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dkkt"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

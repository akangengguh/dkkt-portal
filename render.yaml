databases:
  - name: dkkt-postgres
    databaseName: dkkt
    user: dkkt
    plan: basic-1gb
    region: singapore
    postgresMajorVersion: 16

services:
  - type: web
    name: dkkt-portal
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dkkt-postgres
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        value: https://dkkt.or.id
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: UPLOAD_STORAGE_DRIVER
        value: remote
      - key: UPLOAD_STORAGE_BASE_URL
        sync: false
      - key: UPLOAD_STORAGE_BUCKET
        sync: false
      - key: UPLOAD_STORAGE_REGION
        sync: false
      - key: UPLOAD_STORAGE_ENDPOINT
        sync: false
      - key: UPLOAD_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: UPLOAD_STORAGE_SECRET_ACCESS_KEY
        sync: false